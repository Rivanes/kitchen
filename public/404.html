<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Kitchen</title>
<meta name="referrer" content="no-referrer"></head><body>
<script>
  // GitHub Pages has no SPA history fallback. Restore only the known /admin route.
  if (/^\/kitchen\/admin\/?$/.test(window.location.pathname)) {
    window.location.replace('/kitchen/?kitchen_admin_route=1');
  } else {
    document.body.textContent = 'Nie znaleziono strony Kitchen.';
  }
</script></body></html>
