name: Kitchen QA

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Verify project contracts and Voice regressions
        run: node scripts/verify-project.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify exact lockfile, dependencies and npm version
        run: node scripts/n0-verify-lock.mjs

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
